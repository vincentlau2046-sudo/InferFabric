<div class="tab-content" id="tab-anomaly" style="display:none;padding:1.5rem">
  <!-- Header -->
  <div class="if-card" style="margin-bottom:16px">
    <div class="if-card-hdr">
      <div class="if-card-icon" style="background:rgba(220,38,38,0.12);color:var(--if-c-red)">
        <svg width="16" height="16"><use href="#s-alert"/></svg>
      </div>
      <span class="if-card-title">异常事件</span>
      <span class="if-card-badge" id="anomaly-count-badge" style="display:none">0</span>
    </div>
    <div style="padding:12px 16px 8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <label style="color:var(--text3);font-size:13px">类别</label>
      <select id="anomaly-category-filter" style="padding:4px 8px;border:1px solid var(--bg3);border-radius:6px;background:var(--bg1);color:var(--text1);font-size:13px">
        <option value="">全部</option>
        <option value="routing">路由</option>
        <option value="model">模型</option>
        <option value="auth">认证</option>
        <option value="config">配置</option>
        <option value="cloud">云端</option>
      </select>
      <label style="color:var(--text3);font-size:13px">严重度</label>
      <select id="anomaly-severity-filter" style="padding:4px 8px;border:1px solid var(--bg3);border-radius:6px;background:var(--bg1);color:var(--text1);font-size:13px">
        <option value="">全部</option>
        <option value="info">🟢 info</option>
        <option value="warning">🟡 warning</option>
        <option value="error">🔴 error</option>
        <option value="critical">⚫ critical</option>
      </select>
      <span id="anomaly-count" style="font-size:12px;color:var(--text3);margin-left:auto"></span>
    </div>
  </div>

  <!-- Event list -->
  <div class="if-card">
    <div id="anomaly-event-list" style="font-family:var(--mono);font-size:13px;min-height:100px;padding:12px 16px">
      <p style="color:var(--text3)">加载中...</p>
    </div>
  </div>
</div>
