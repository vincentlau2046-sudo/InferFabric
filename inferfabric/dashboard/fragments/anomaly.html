<div class="tab-content" id="tab-anomaly" style="display:none;padding: 1.5rem">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
    <h2 style="font-size:1.25rem;font-weight:600;color:var(--text1)">⚠️ 异常事件</h2>
    <div style="display:flex;gap:8px;align-items:center">
      <label style="color:var(--text3);font-size:13px">类别</label>
      <select id="anomaly-category-filter" style="padding:4px 8px;border:1px solid var(--bg3);border-radius:6px;background:var(--bg1);color:var(--text1);font-size:13px">
        <option value="">全部</option>
        <option value="routing">路由</option>
        <option value="model">模型</option>
        <option value="auth">认证</option>
        <option value="config">配置</option>
        <option value="cloud">云端</option>
      </select>
      <label style="color:var(--text3);font-size:13px">严重度</label>
      <select id="anomaly-severity-filter" style="padding:4px 8px;border:1px solid var(--bg3);border-radius:6px;background:var(--bg1);color:var(--text1);font-size:13px">
        <option value="">全部</option>
        <option value="info">🟢 info</option>
        <option value="warning">🟡 warning</option>
        <option value="error">🔴 error</option>
        <option value="critical">⚫ critical</option>
      </select>
      <span id="anomaly-count" style="font-size:12px;color:var(--text3);padding-left:8px"></span>
    </div>
  </div>
  <div id="anomaly-event-list" style="font-family:var(--mono);font-size:13px">
    <p style="color:var(--text3)">加载中...</p>
  </div>
  <div style="margin-top:1rem;padding-top:0.75rem;border-top:1px solid var(--bg3);display:flex;gap:16px;font-size:12px;color:var(--text3)">
    <span>缓存: <b id="cache-status" style="color:var(--if-c-green)">检测中...</b></span>
    <span>异常采集: <span id="anomaly-collector-status" style="color:var(--if-c-green)">运行中</span></span>
  </div>
</div>
