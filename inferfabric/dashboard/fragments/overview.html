<div class="tab-content active" id="tab-overview">

  <!-- Row 2: 活跃模型卡 (col 8) + 24h 请求趋势 sparkline (col 4) -->
  <div class="if-grid">

    <!-- 活跃模型卡（overview.js 按 active_services 动态填充：0/1/N 模型） -->
    <div class="col-8">
      <div class="if-card" id="ovActiveCard">
        <div class="if-card-hdr">
          <span class="status-dot"></span>
          <span class="if-card-title muted">加载中…</span>
        </div>
        <div class="if-card-body" id="ovActiveBody"></div>
      </div>
    </div>

    <!-- 请求趋势 sparkline（overview.js 按 __TOKEN_STATS__ 按日聚合，最近 7 天） -->
    <div class="col-4">
      <div class="if-card" id="ovSpark24h">
        <div class="if-card-hdr">
          <span class="if-card-title">请求趋势</span>
          <span class="if-card-sub">近 7 天</span>
        </div>
        <div class="if-card-body ov-spark-body">
          <div class="spark-empty muted">加载中…</div>
        </div>
      </div>
    </div>

  </div>

  <!-- Row 3: 最近异常 top3 (col 8) + 系统操作 (col 4) -->
  <div class="if-grid">

    <!-- 最近异常（overview.js GET /api/anomalies 取 top3 填充） -->
    <div class="col-8">
      <div class="if-card" id="ovAnomTop">
        <div class="if-card-hdr">
          <span class="if-card-title">最近异常</span>
          <a class="if-card-link" href="#" data-action="view-all">查看全部</a>
        </div>
        <div class="if-card-body">
          <div class="spark-empty muted">加载中…</div>
        </div>
      </div>
    </div>

    <!-- 系统操作（data-action 事件委托 → window.doSystemOps） -->
    <div class="col-4">
      <div class="if-card" id="sysOpsCard">
        <div class="if-card-hdr">
          <span class="if-card-title">系统操作</span>
        </div>
        <div class="if-card-body sys-ops">
          <button class="btn btn-sec" data-action="release">
            <svg><use href="#s-release"/></svg>释放 GPU
          </button>
          <button class="btn btn-sec" data-action="reconcile">
            <svg><use href="#s-refresh"/></svg>Reconcile
          </button>
          <button class="btn btn-sec" data-action="reload">
            <svg><use href="#s-gear"/></svg>重载配置
          </button>
          <button class="btn btn-danger" data-action="reset">
            <svg><use href="#s-alert"/></svg>强制重置
          </button>
        </div>
      </div>
    </div>

  </div>

</div>
