<!-- ── 静态原型假数据：GPU 遥测带 + 模式徽标 ───────────────────────────
     Task 1 在 base.html 留下遥测带占位（—/width:0%）；store.js 尚未绑定
     遥测带（"遥测带由后续任务接管"），故此处一次性填充假值即持久可见。
     Task 3 接 /api/snapshot 真实绑定时删除本 <script> 整块。 ── -->
<script>
(function () {
  function setTxt(id, t){ var el = document.getElementById(id); if (el) el.textContent = t; }
  function setFill(id, w, cls){
    var el = document.getElementById(id); if (!el) return;
    el.style.width = w;
    el.className = 'tr-fill' + (cls ? ' ' + cls : '');   // 87% < 90% → 不加 crit
  }
  setTxt('trVram',  '24.1'); setFill('trVramFill', '75.3%');
  setTxt('trUtil',  '87');   setFill('trUtilFill',  '87%');
  setTxt('trPwr',   '320');
  setTxt('trTemp',  '68');
  setTxt('trClock', '2.41');

  // 模式徽标：活跃重模型 → exclusive。store.js 订阅 gpu_mode 会在每次
  // /api/snapshot 后改写为真实值；在截图窗口内重置回 exclusive，保证静态
  // 原型视觉连贯。带 no-op 守卫避免 MutationObserver 反馈循环。Task 3 删除。
  var mb = document.getElementById('modeBadge');
  if (mb) {
    function applyExclusive(){
      var t = mb.querySelector('.mode-txt');
      var cur = t ? t.textContent : '';
      if (mb.className === 'if-mode exclusive' && cur === 'exclusive') return;
      mb.className = 'if-mode exclusive';
      if (t) t.textContent = 'exclusive';
    }
    applyExclusive();
    try {
      var obs = new MutationObserver(function(){ applyExclusive(); });
      obs.observe(mb, { attributes: true, childList: true, subtree: true, characterData: true });
      setTimeout(function(){ obs.disconnect(); }, 6000);
    } catch (e) {}
  }
})();
</script>
