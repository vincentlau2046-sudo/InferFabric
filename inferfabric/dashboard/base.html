<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InferFabric</title>
<style>
<!-- CSS:main -->
</style>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 12 SVG Symbols -->
    <symbol id="s-gpu" viewBox="0 0 22 22" fill="none">
      <rect x="2" y="5" width="18" height="12" rx="2.5" stroke="currentColor" stroke-width="1.5"/>
      <rect x="6" y="8" width="10" height="6" rx="1" fill="currentColor" opacity=".25"/>
      <path d="M8 5V2.5h6V5M6 17v2.5h10V17" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="11" cy="11" r="1.2" fill="currentColor"/>
    </symbol>
    <symbol id="s-memory" viewBox="0 0 22 22" fill="none">
      <rect x="3" y="4" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
      <rect x="6" y="7" width="2.5" height="8" rx=".4" fill="currentColor" opacity=".35"/>
      <rect x="10" y="7" width="2.5" height="8" rx=".4" fill="currentColor" opacity=".5"/>
      <rect x="14" y="7" width="2.5" height="8" rx=".4" fill="currentColor" opacity=".25"/>
    </symbol>
    <symbol id="s-cpu" viewBox="0 0 22 22" fill="none">
      <rect x="4.5" y="4.5" width="13" height="13" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
      <path d="M7.5 8.5h7v5h-7z" fill="currentColor" opacity=".25"/>
      <path d="M11 2v3M11 17v3M2 11h3M17 11h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </symbol>
    <symbol id="s-chart" viewBox="0 0 22 22" fill="none">
      <rect x="2" y="2" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
      <path d="M6 16V10l3 3 4-5 3 2v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="s-message" viewBox="0 0 22 22" fill="none">
      <path d="M3 11a8.5 8.5 0 0 1 16 0 8.5 8.5 0 0 1-12.5 7.5L3 19l2-3.5A8.5 8.5 0 0 1 3 11z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>
    <symbol id="s-cube" viewBox="0 0 22 22" fill="none">
      <path d="M11 2l7 4.5v9L11 20l-7-4.5v-9L11 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M11 11l7-4.5M11 11v9M11 11l-7-4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="s-cloud" viewBox="0 0 22 22" fill="none">
      <path d="M6 14.5A5 5 0 0 1 9.5 5a6.5 6.5 0 1 1 8 9.5H6a3.5 3.5 0 0 1 0-1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>
    <symbol id="s-swap" viewBox="0 0 22 22" fill="none">
      <path d="M16 16l-4 4-4-4M16 6l-4-4-4 4M12 20V2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="s-gear" viewBox="0 0 22 22" fill="none">
      <circle cx="11" cy="11" r="3" stroke="currentColor" stroke-width="1.5"/>
      <path d="M11 2v2.5m0 13V20m9-9h-2.5m-13 0H2m15.5-4.5l-1.8 1.8M6.3 12.7l-1.8 1.8m12.5 0l-1.8-1.8M7.5 9.3L5.7 7.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </symbol>
    <symbol id="s-bolt" viewBox="0 0 22 22" fill="none">
      <path d="M12 2L5 12h5l-1 8 8-11h-5l1-8z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>
    <symbol id="s-check" viewBox="0 0 22 22" fill="none">
      <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="1.5"/>
      <path d="M7 11l3 3 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="s-xmark" viewBox="0 0 22 22" fill="none">
      <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="1.5"/>
      <path d="M8 8l6 6m0-6l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>
</head>
<body>

<div class="if-app">
  <!-- 顶栏 -->
  <header class="if-topbar">
    <div class="if-dots">
      <span class="if-dot red"></span>
      <span class="if-dot yellow"></span>
      <span class="if-dot green"></span>
    </div>
    <span class="if-title">InferFabric</span>
    <div class="if-topbar-right">
      <span id="sTag" class="tag idle"><span class="dot"></span><span id="sTxt">idle</span></span>
      <span class="if-ver" id="navVer"></span>
      <span class="if-sep"></span>
      <span class="if-sync" id="syncMeta" title="最近同步时间 + rev"></span>
      <button class="if-refresh" id="refreshNow" onclick="refreshNow()" title="立即刷新">⟳</button>
      <span class="if-sep"></span>
      <span class="if-clock" id="ts">—</span>
      <button class="if-theme" id="themeToggle" onclick="toggleTheme()">☀️</button>
      <a class="if-apilink" href="/api/openapi.json" target="_blank" title="OpenAPI 规范">📖</a>
    </div>
  </header>

  <div class="if-body">
    <!-- 侧边栏 -->
    <aside class="if-sidebar">
      <div class="if-brand">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <rect width="36" height="36" rx="10" fill="#cc7a60"/>
          <path d="M18 8c-5.5 0-10 4-10 9s4 9 10 9c2 0 3.8-.5 5.4-1.4l-2.8-3a5 5 0 0 1-2.6.7c-2.8 0-5-2-5-4.7 0-2.5 2-4.6 5-4.6 2.5 0 4.5 1.8 4.9 4.1l4.3-3C24 10 21.2 8 18 8z" fill="#fff" opacity=".95"/>
          <path d="M20 14l-4 5h3l-1 4 4-5h-3l1-4z" fill="#fff" opacity=".8"/>
        </svg>
        <div>
          <div class="if-brand-name">InferFabric</div>
          <div class="if-brand-sub">控制面板</div>
        </div>
      </div>

      <nav class="if-nav">
        <button class="if-nav-item active" data-tab="tab-overview" onclick="switchTab('tab-overview')">
          <svg width="22" height="22"><use href="#s-chart"/></svg>
          <span>总览</span>
        </button>
        <button class="if-nav-item" data-tab="tab-inference" onclick="switchTab('tab-inference')">
          <svg width="22" height="22"><use href="#s-message"/></svg>
          <span>推理</span>
        </button>
        <button class="if-nav-item" data-tab="tab-monitor" onclick="switchTab('tab-monitor')">
          <svg width="22" height="22"><use href="#s-chart"/></svg>
          <span>监控</span>
        </button>
        <button class="if-nav-item" data-tab="tab-deploy" onclick="switchTab('tab-deploy')">
          <svg width="22" height="22"><use href="#s-cube"/></svg>
          <span>部署</span>
        </button>
        <button class="if-nav-item" data-tab="tab-cloud" onclick="switchTab('tab-cloud')">
          <svg width="22" height="22"><use href="#s-cloud"/></svg>
          <span>云端</span>
        </button>
      </nav>

      <div class="if-foot">
        <span class="sidebar-status-dot" id="sidebarStatusDot"></span>
        <span id="sidebarSyncTxt">运行中</span>
      </div>
    </aside>

    <!-- 主区域 -->
    <main class="if-main">
      <!-- 4 指标条 (sticky) -->
      <div class="if-metrics">
        <div class="if-metric-card">
          <div class="if-metric-top">
            <svg width="16" height="16"><use href="#s-gpu"/></svg>
            <span class="if-metric-label">GPU 显存</span>
          </div>
          <div class="if-metric-row">
            <span class="if-metric-val" id="gP">0</span><span class="if-metric-unit">%</span>
          </div>
          <div class="if-metric-track"><div class="if-metric-fill" id="gB" style="width:0%"></div></div>
          <div class="if-metric-sub">已用 <b id="gU">0</b> / <span id="gT">32,607</span> MB</div>
        </div>
        <div class="if-metric-card">
          <div class="if-metric-top">
            <svg width="16" height="16"><use href="#s-bolt"/></svg>
            <span class="if-metric-label">GPU 负载</span>
          </div>
          <div class="if-metric-row">
            <span class="if-metric-val" id="guP">0</span><span class="if-metric-unit">%</span>
          </div>
          <div class="if-metric-track"><div class="if-metric-fill" id="guB" style="width:0%"></div></div>
          <div class="if-metric-sub"><span id="guC">—</span> MHz · <span id="guW">—</span> W · <span id="guT">—</span></div>
        </div>
        <div class="if-metric-card">
          <div class="if-metric-top">
            <svg width="16" height="16"><use href="#s-memory"/></svg>
            <span class="if-metric-label">系统内存</span>
          </div>
          <div class="if-metric-row">
            <span class="if-metric-val" id="rP">0</span><span class="if-metric-unit">%</span>
          </div>
          <div class="if-metric-track"><div class="if-metric-fill" id="rB" style="width:0%"></div></div>
          <div class="if-metric-sub">已用 <b id="rU">0</b> / <span id="rT">—</span> GB</div>
        </div>
        <div class="if-metric-card">
          <div class="if-metric-top">
            <svg width="16" height="16"><use href="#s-cpu"/></svg>
            <span class="if-metric-label">CPU 负载</span>
          </div>
          <div class="if-metric-row">
            <span class="if-metric-val" id="cP">0</span><span class="if-metric-unit">%</span>
          </div>
          <div class="if-metric-track"><div class="if-metric-fill" id="cB" style="width:0%"></div></div>
          <div class="if-metric-sub"><span id="cC">—</span> 核 · <span id="cU">—</span></div>
        </div>
      </div>

      <!-- Tab 内容 -->
      <!-- FRAGMENT:overview -->
      <!-- FRAGMENT:inference -->
      <!-- FRAGMENT:monitor -->
      <!-- FRAGMENT:deploy -->
      <!-- FRAGMENT:cloud -->
    </main>
  </div>
</div>

  <!-- 控制栏 (固定底部，所有 TAB 可见) -->
  <div class="if-ctrls">
    <button class="if-btn if-btn-pri" onclick="doSwitch('idle')">🔓 释放 GPU</button>
    <button class="if-btn if-btn-sec" onclick="doReconcile()">⚖️ Reconcile</button>
    <button class="if-btn if-btn-sec" onclick="doReloadConfig()">🔄 重载配置</button>
    <button class="if-btn if-btn-warn" onclick="doReset()">⚠️ 强制重置</button>
  </div>

<!-- Toast -->
<div class="toast-banner" id="toast"></div>
<!-- API Error Banner -->
<div id="apiErrorBanner" class="api-err-banner" style="display:none">
  <span>⚠️ API 连接异常</span>
  <button onclick="window.store?.fetchSnapshot(true)">重试</button>
</div>
<!-- Switch Overlay -->
<div id="switchOverlay" class="switch-overlay" style="display:none">
  <div class="switch-overlay-inner">
    <div class="switch-spinner"></div>
    <span id="switchOverlayMsg">正在切换模型…</span>
  </div>
</div>

<script>
<!-- JS:bindings -->
<!-- JS:state -->
<!-- JS:app -->
<!-- JS:monitor -->
</script>
</body>
</html>
