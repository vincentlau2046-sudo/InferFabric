name: gemma4-31b-vl
description: "Huihui Gemma4-31B IT Abliterated v2 NVFP4 Dense"
type: vllm
gpu_role: exclusive
model_type: vl
quantization: NVFP4
peak_vram_mb: 30000

vllm:
  model_dir: Huihui-gemma-4-31B-it-abliterated-v2-NVFP4
  served_name: gemma4-31b-vl
  port: 8005
  conda_env: gemma-4-31b
  gpu_memory_utilization: 0.93
  max_model_len: 262144
  max_num_seqs: 8
  kv_cache_dtype: fp8
  startup_timeout: 480
  extra_flags: >-
    --enable-prefix-caching
    --compilation-config '{"cudagraph_mode": "PIECEWISE", "cudagraph_capture_sizes": [1, 2, 4, 8]}'
    --enable-chunked-prefill
    --async-scheduling
    --enable-auto-tool-choice
    --tool-call-parser gemma4
    --reasoning-parser gemma4
    --trust-remote-code
    --limit-mm-per-prompt '{"image": 4, "audio": 0}'
    --kv-offloading-backend native
    --kv-offloading-size 16
  extra_env:
    FLASHINFER_DISABLE_VERSION_CHECK: "1"
    VLLM_USE_DEEP_GEMM: "0"
