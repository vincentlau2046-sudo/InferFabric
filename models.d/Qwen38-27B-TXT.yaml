# ═══════════════════════════════════════════════════════════════════
# 本文件 = 模型「启动真相源」（default 场景的基线值，only 由人/工具链外修改，
# tune 工具链对其只读）。但**当前机器上生效的 live 值 ≠ 仅看本文件**：
#     live = 本 YAML 值 ＋ 应用层 overlay（~/.inferfabric/active_scenarios.yaml，
#            由 `iff tune <preset>` 写入；示例 `iff status` 的 scenario_active）
# 判断「当前是哪个场景」以 `iff tune Qwen38-27B-TXT` 或 Dashboard ⚙场景 为准，
# 不要只看本 YAML —— 场景已应用时本 YAML 数值是 baseline，不等于 live。
#
# 场景一览（定义在 models.d/scenarios.yaml 侧车，本文件不内联 presets）：
#   default     C5 · 204800 · draft1（= 本文件值；池顶 1024000，超卖 41.4%）
#   short-ctx   C6 · 131072 · draft2（低延迟；池顶 786432，超卖 23.7%）
#   small-batch C3 · 262144 · draft3（顶窗长文档；池顶 786432，超卖 23.7%）
#   big-batch   C5 · 204800 · draft2（长窗批处理；池顶 1024000，超卖 41.4%）
# kv_capacity = 600000 是**固定物理 KV 池**（NVFP4），不是场景字段、不随场景改。
# 超卖是刻意设计（C/W 配出的池顶 > 固定池时满载靠 preempt 兜底），仅 ⚠ 不阻塞。
# ═══════════════════════════════════════════════════════════════════
name: Qwen38-27B-TXT
description: Qwen3.8-27B NVFP4 — NInfer 推理引擎（纯文本，256K 上下文，MTP 投机解码）
type: ninfer
gpu_role: exclusive
model_type: llm
quantization: NVFP4
peak_vram_mb: 30500
ninfer:
  served_name: Qwen38-27B-TXT
  weight_path: ~/models/ninfer-nvfp4/qwen3_8_27b_nvfp4.ninfer
  docker_image: ninfer:auto
  port: 8007
  container_name: iff-ninfer-qwen38
  max_context: 204800
  kv_capacity: 600000
  kv_dtype: nvfp4
  weight_precision: NVFP4
  max_concurrency: 5
  default_max_tokens: 32000
  prefill_chunk: 2048
  pending_timeout_ms: 600000
  enable_mtp: true
  draft_tokens: 1
  enable_lm_head_draft: false
  startup_timeout: 120
  model_id: Qwen38-27B-TXT
  media_cache_mib: 0
  media_live_mib: 384
