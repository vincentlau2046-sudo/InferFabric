# ═══════════════════════════════════════════════════════════════════
# 本文件 = 模型「启动真相源」（default 场景的基线值，tune 工具链对其只读）。
# 但**当前机器上生效的 live 值 ≠ 仅看本文件**：
#     live = 本 YAML 值 ＋ 应用层 overlay（~/.inferfabric/active_scenarios.yaml，
#            由 `iff tune <preset>` 写入；示例 `iff status` 的 scenario_active）
# 判断「当前是哪个场景」以 `iff tune NI-Qwen38-27B-VL` 或 Dashboard ⚙场景 为准，
# 不要只看本 YAML —— 场景已应用时本 YAML 数值是 baseline，不等于 live。
#
# 场景一览（定义在 models.d/scenarios.yaml 侧车，本文件不内联 presets）：
#   default     C4 · 204800 · draft1（= 本文件值；池顶 819200，超卖 50.0%）
#   short-ctx   C5 · 131072 · draft2（视觉低延迟；池顶 655360，超卖 37.4%）
#   small-batch C2 · 262144 · draft3（视觉顶窗；池顶 524288，超卖 21.8%）
#   big-batch   C3 · 204800 · draft2（视觉长窗批处理；池顶 614400，超卖 33.3%）
# kv_capacity = 410000 是**固定物理 KV 池**（NVFP4 + 视觉塔占显存），不是场景字段、
# 不随场景改。超卖是刻意设计（满载靠 preempt 兜底），仅 ⚠ 不阻塞。
# ⚠ 注意：VL 模型平时不激活，需要时先向用户申请、由用户切换
#   （iff switch NI-Qwen38-27B-VL），未经切换直接发图像请求会 500。
# ═══════════════════════════════════════════════════════════════════
name: NI-Qwen38-27B-VL
description: Qwen3.8-27B NVFP4 — NInfer 推理引擎（多模态 VL，视觉塔 + NVFP4 KV cache，快速启动）
type: ninfer
gpu_role: exclusive
model_type: vl
quantization: NVFP4
peak_vram_mb: 30500

ninfer:
  served_name: NI-Qwen38-27B-VL
  model_id: NI-Qwen38-27B-VL
  weight_path: ~/models/ninfer-qwen38-27b-vl/qwen3_8_27b_vl_nvfp4.ninfer
  docker_image: ninfer:vl
  port: 8009
  container_name: iff-ninfer-qwen38-vl
  max_context: 204800
  kv_capacity: 410000
  kv_dtype: nvfp4
  weight_precision: NVFP4
  max_concurrency: 4
  default_max_tokens: 32000
  prefill_chunk: 2048
  pending_timeout_ms: 600000
  enable_mtp: true
  draft_tokens: 1
  vision: true
  # 压 media 显存让给 KV: cache 0(关跨请求复用) + live 1024MiB(minimum ~384MiB)
  media_cache_mib: 0
  media_live_mib: 1024
  startup_timeout: 300