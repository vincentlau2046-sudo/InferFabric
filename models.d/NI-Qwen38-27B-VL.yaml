name: NI-Qwen38-27B-VL
description: Qwen3.8-27B NVFP4 — NInfer 推理引擎（多模态 VL，视觉塔 + NVFP4 KV cache，快速启动）
type: ninfer
gpu_role: exclusive
model_type: vl
quantization: NVFP4
peak_vram_mb: 31000

ninfer:
  served_name: NI-Qwen38-27B-VL
  model_id: NI-Qwen38-27B-VL
  weight_path: ~/models/ninfer-qwen38-27b-vl/qwen3_8_27b_vl_nvfp4.ninfer
  docker_image: ninfer:vl
  port: 8009
  container_name: iff-ninfer-qwen38-vl
  max_context: 262144
  kv_capacity: 410000
  kv_dtype: nvfp4
  weight_precision: NVFP4
  max_concurrency: 4
  default_max_tokens: 32000
  prefill_chunk: 2048
  pending_timeout_ms: 600000
  enable_mtp: true
  draft_tokens: 1
  vision: true
  # 压 media 显存让给 KV: cache 0(关跨请求复用) + live 1024MiB(minimum ~384MiB)
  media_cache_mib: 0
  media_live_mib: 1024
  startup_timeout: 300