name: qwen38-27b-vl
description: "Qwen3.8-27B NVFP4 + MTP + Vision (Unsloth)"
gpu_role: exclusive
model_type: vl
quantization: NVFP4
peak_vram_mb: 28000

vllm:
  model_dir: Qwen3.8-27B-NVFP4
  served_name: qwen38-27b-vl
  port: 8008
  conda_env: Qwen3.8-27B-VL
  max_model_len: 131072
  gpu_memory_utilization: 0.93
  max_num_seqs: 4
  kv_cache_dtype: fp8
  speculative_config: '{"method": "mtp", "num_speculative_tokens": 2}'
  extra_flags: >-
    --max-num-batched-tokens 4096
    --enable-prefix-caching
    --compilation-config '{"cudagraph_mode": "PIECEWISE", "cudagraph_capture_sizes": [1, 2, 4, 8]}'
    --enable-chunked-prefill
    --async-scheduling
    --enable-auto-tool-choice
    --tool-call-parser qwen3_xml
    --reasoning-parser qwen3
    --trust-remote-code
    --attention-backend flashinfer
    --kv-offloading-backend native
    --kv-offloading-size 16
  startup_timeout: 480
  extra_env:
    FLASHINFER_DISABLE_VERSION_CHECK: "1"
    VLLM_USE_DEEP_GEMM: "0"
