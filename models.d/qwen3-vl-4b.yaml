name: qwen3-vl-4b
description: "Qwen3-VL-4B-Instruct GPTQ W4A16 — vLLM shared Vision-Language (AICF 质检)"
type: vllm
gpu_role: shared
model_type: vl
peak_vram_mb: 5600
vllm:
  model_dir: Qwen3-VL-4B-GPTQ-W4A16
  served_name: qwen3-vl-4b
  port: 8002
  conda_env: qwen3-vl-4b-vllm
  max_model_len: 32768
  gpu_memory_utilization: 0.30
  max_num_seqs: 8
  kv_cache_dtype: fp8
  extra_env:
    FLASHINFER_DISABLE_VERSION_CHECK: "1"
  startup_timeout: 480
  extra_flags: >-
    --trust-remote-code
    --enable-chunked-prefill
    --max-num-batched-tokens 4096