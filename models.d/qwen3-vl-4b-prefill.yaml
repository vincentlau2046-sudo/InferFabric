name: qwen3-vl-4b-prefill
description: "Qwen3-VL-4B GPTQ W4A16 — P/D Prefill (P) instance"
type: vllm
gpu_role: shared
model_type: vl
peak_vram_mb: 5600
vllm:
  model_dir: Qwen3-VL-4B-GPTQ-W4A16
  served_name: qwen3-vl-4b-prefill
  port: 8010
  conda_env: qwen3-vl-4b-vllm
  max_model_len: 65536
  gpu_memory_utilization: 0.30
  max_num_seqs: 8
  kv_cache_dtype: fp8
  extra_env:
    FLASHINFER_DISABLE_VERSION_CHECK: "1"
    PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:64"
  startup_timeout: 480
  extra_flags: >-
    --trust-remote-code
    --enable-chunked-prefill
    --enable-prefix-caching
    --compilation-config '{"cudagraph_mode": "PIECEWISE", "cudagraph_capture_sizes": [1, 2, 4, 8]}'
    --async-scheduling
    --attention-backend flashinfer
    --max-num-batched-tokens 4096
    --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_rank":0,"kv_parallel_size":2}'