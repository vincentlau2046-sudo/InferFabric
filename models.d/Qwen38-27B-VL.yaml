name: Qwen38-27B-VL
description: Qwen3.8-27B Abliterated NVFP4 — 去审查 VL 版本（基于 Huihui-Qwen3.8-27B-abliterated-NVFP4）
gpu_role: exclusive
model_type: vl
quantization: NVFP4
peak_vram_mb: 30300
vllm:
  model_dir: Huihui-Qwen3.8-27B-abliterated-NVFP4
  served_name: Qwen38-27B-VL
  port: 8002
  conda_env: Qwen3.8-27B-VL
  max_model_len: 131072
  gpu_memory_utilization: 0.95
  max_num_seqs: 4
  kv_cache_dtype: fp8
  kv_offloading_size: 16
  kv_offloading_backend: native
  extra_flags: '--max-num-batched-tokens 2048 --enable-prefix-caching --mamba-ssm-cache-dtype
    float16     --speculative-config ''{"method": "mtp", "num_speculative_tokens":
    1}'' --compilation-config ''{"cudagraph_mode": "PIECEWISE", "cudagraph_capture_sizes":
    [1, 2, 3, 4]}'' --enable-chunked-prefill --async-scheduling --enable-auto-tool-choice
    --tool-call-parser qwen3_xml --reasoning-parser qwen3 --trust-remote-code'
  startup_timeout: 700
  extra_env:
    FLASHINFER_DISABLE_VERSION_CHECK: '1'
    VLLM_USE_DEEP_GEMM: '0'
